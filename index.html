<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBB Stock Take</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TBB Stock Take">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d9; --accent: #1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1f1f1d; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f; --accent: #4cc38a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  [hidden] { display: none !important; }
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; height: calc(34px + env(safe-area-inset-top));
         padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 8px;
         background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; }
  #bar img { width: 22px; height: 22px; border-radius: 6px; }
  #bar .sp { flex: 1; }
  #bar button { border: 1px solid rgba(255,255,255,.5); background: none; color: #fff; border-radius: 999px;
                padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #clip { position: fixed; left: 0; right: 0; bottom: 0; top: calc(34px + env(safe-area-inset-top)); overflow: hidden; }
  /* Google's "created by a Google Apps Script user" bar is not shown when the app is embedded like this. */
  #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #pick { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 360px; text-align: center; }
  .card img { width: 88px; height: 88px; border-radius: 22px; }
  .card h1 { margin: 12px 0 2px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; border-radius: 12px;
                 border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit;
                 font-size: 17px; font-weight: 600; cursor: pointer; }
  .card button:hover { border-color: var(--accent); }
  .card button small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
  .card button.back { border: 0; background: none; color: var(--muted); font-size: 15px; font-weight: 400; padding: 8px; }
  #msg { position: fixed; left: 0; right: 0; top: 50%; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="pick" hidden>
  <div class="card">
    <img src="icon-192.png" alt="">
    <h1>TBB Stock Take</h1>
    <p id="ask">Which section do you work in?</p>
    <div id="outlets"></div>
  </div>
</div>
<div id="bar" hidden>
  <img src="icon-192.png" alt="">
  <span id="name"></span>
  <span class="sp"></span>
  <button type="button" id="switch">Switch</button>
</div>
<div id="clip" hidden><div id="msg">Loading…</div><iframe id="app" title="TBB Stock Take" allow="camera; clipboard-write"></iframe></div>
<script>
  // Each section's web apps (Apps Script deployments; links never change when an app is updated).
  // Kitchen: ..\Kitchen Stock Take. FOH + Bakery: ..\FOH and Bakery Stock Take.
  var SECTIONS = [
    { name: 'Kitchen', outlets: [
      { name: 'TBB TTDI', url: 'https://script.google.com/macros/s/AKfycbxc7ES4iyT7kMVVHPFa-agBV1MHdMn1Z6QPuVhqifRGSIN8iOPM1UNFNREttrYDmHgM/exec' },
      { name: 'TBB Publika', url: 'https://script.google.com/macros/s/AKfycbxLsbo5Rpv4OZt6uqrWyr-DGeoQMmgcITvSa1dcvnPtno900ZoK2nVyXq2bEJ9bL_dPEg/exec' },
      { name: 'FLAT18', url: 'https://script.google.com/macros/s/AKfycbxi1Nu_u8WY4VsDB5fu4wQBWQWZOoiJR6geQyGLXBiagyOGqzCXaWxnk2TwmUUDdtRAAg/exec' }
    ] },
    { name: 'FOH', outlets: [
      { name: 'TBB TTDI', url: 'https://script.google.com/macros/s/AKfycbwmf7pSB92ZVWfgL3nHcw48aYlY1E6zTqxh-_VrkOdlYBA6EJiHrLQxb7mmjXTNwr05bw/exec' },
      { name: 'TBB Publika', url: 'https://script.google.com/macros/s/AKfycbxCLgafcuHbTEozxlV5sqwu9auMz3HTrchcP8puCtgcF1fK63Q7eCJ_scc9H0cdzTMERg/exec' },
      { name: 'FLAT18', url: 'https://script.google.com/macros/s/AKfycbzmlGB0Hl_t7yTKrH7aEeSbbrcPsIYv0oWZUl_cDX5g0-sXHD3jlFvdxDOj6sVfqs06IQ/exec' }
    ] },
    { name: 'Bakery', outlets: [
      { name: 'TBB TTDI', url: 'https://script.google.com/macros/s/AKfycbw7Q3FE1bK60fcnM7-sZ6mNku3BGF-nPphjSgI_SueRzPfQqym4OWu3Cr97uwQpCTE_bw/exec' }
    ] }
  ];
  function $(id) { return document.getElementById(id); }
  // Saved choice is "Section|Outlet". Phones set up before FOH/Bakery existed saved just the outlet: that was Kitchen.
  function get() { try { return localStorage.getItem('tbb_outlet'); } catch (e) { return null; } }
  function set(v) { try { if (v) localStorage.setItem('tbb_outlet', v); else localStorage.removeItem('tbb_outlet'); } catch (e) {} }
  function find(saved) {
    if (!saved) return null;
    var p = saved.indexOf('|') < 0 ? ['Kitchen', saved] : saved.split('|');
    var s = SECTIONS.filter(function (x) { return x.name === p[0]; })[0];
    var o = s && s.outlets.filter(function (x) { return x.name === p[1]; })[0];
    return o ? { section: s.name, name: o.name, url: o.url } : null;
  }

  function button(label, sub, onclick, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (sub) { var s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
    if (cls) b.className = cls;
    b.onclick = onclick;
    $('outlets').appendChild(b);
  }

  function showPicker() {
    $('pick').hidden = false;
    $('bar').hidden = true;
    $('clip').hidden = true;
    $('ask').textContent = 'Which section do you work in?';
    $('outlets').innerHTML = '';
    SECTIONS.forEach(function (s) {
      var names = s.outlets.map(function (o) { return o.name; }).join(', ');
      button(s.name, names, function () {
        if (s.outlets.length === 1) choose(s, s.outlets[0]); else showOutlets(s);
      });
    });
  }

  function showOutlets(s) {
    $('ask').textContent = s.name + ': which outlet?';
    $('outlets').innerHTML = '';
    s.outlets.forEach(function (o) { button(o.name, '', function () { choose(s, o); }); });
    button('‹ Back', '', showPicker, 'back');
  }

  function choose(s, o) {
    set(s.name + '|' + o.name);
    open({ section: s.name, name: o.name, url: o.url });
  }

  function open(o) {
    $('pick').hidden = true;
    $('bar').hidden = false;
    $('clip').hidden = false;
    $('name').textContent = o.section + ' · ' + o.name;
    document.title = 'TBB ' + o.section + ' - ' + o.name;
    if (!navigator.onLine) { $('msg').textContent = 'No internet connection. Connect and reopen the app.'; }
    var f = $('app');
    if (f.getAttribute('data-url') !== o.url) {
      f.setAttribute('data-url', o.url);
      f.src = o.url;
    }
  }

  $('switch').onclick = function () { set(null); $('app').removeAttribute('data-url'); $('app').src = 'about:blank'; showPicker(); };
  window.addEventListener('online', function () { $('msg').textContent = 'Loading…'; var f = $('app'); if (f.src) f.src = f.src; });

  var hit = find(get());
  if (hit) open(hit); else showPicker();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
